name: zettaialarm222
description: AIが出す問題を解かないと止まらないアラームアプリ
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  intl: ^0.18.1
  http: ^1.2.0
  shared_preferences: ^2.2.2
  just_audio: ^0.9.36
  flutter_local_notifications: ^16.3.2
  android_alarm_manager_plus: ^3.0.4
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/alarm1.wav

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.jpg"
  remove_alpha_ios: true
